<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Acesso Restrito</title>
    
    <!-- Otimizações 2 e 7: Preconnect para o Telegram -->
    <link rel="dns-prefetch" href="https://t.me">
    <link rel="preconnect" href="https://t.me" crossorigin>
    
    <style>
        /* Otimizações 3, 4, 5, 8 e 9: CSS ultra-minimalista */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050510; /* Otimização 4: Cor sólida, sem gradiente radial caro */
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent; /* Otimização 6 */
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 30px 20px;
            background: rgba(20, 20, 35, 0.95); /* Otimização 3: Sem backdrop-filter */
            border: 1px solid rgba(241, 196, 15, 0.2);
            border-radius: 12px;
            text-align: center;
            /* Otimização 5: Sem box-shadow grande */
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #f1c40f;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cccccc;
            margin-bottom: 2rem;
        }
        .btn-primary {
            display: block;
            width: 100%;
            background: #0088cc; /* Cor sólida para evitar custo de gradiente no clique */
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            /* Otimização 8: Sem transition */
        }
        .btn-secondary {
            display: block;
            margin-top: 1.5rem;
            color: #666666;
            text-decoration: underline;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ Acesso Restrito</h1>
        <p>Este ambiente contém material destinado <strong>exclusivamente a maiores de 18 anos</strong>. Ao prosseguir, você declara ter idade legal.</p>
        
        <a id="telegram-link" href="https://t.me/ninfalucybot?start=organic" class="btn-primary">SIM, TENHO +18 | ACESSAR AGORA</a>
        <a class="btn-secondary" href="https://www.google.com">Não tenho 18 anos, sair</a>
    </div>

    <!-- Otimização 1: Script no final do body, sem DOMContentLoaded -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clickId = urlParams.get('c') || 'organic';
        document.getElementById('telegram-link').href = "https://t.me/ninfalucybot?start=" + clickId;
    </script>
</body>
</html>
