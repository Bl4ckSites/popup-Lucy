<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Verificação de idade para acesso a conteúdo exclusivo.">
    <title>Acesso Restrito | Verificação de Idade</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>️</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            background: radial-gradient(ellipse at 50% 30%, #1a1a3e 0%, #0d0d2b 40%, #020210 100%);
            color: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(241, 196, 15, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #f1c40f;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 2rem;
        }
        .btn-primary {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 18px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 136, 204, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(0, 136, 204, 0.3);
        }
        .btn-secondary {
            display: inline-block;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: underline;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn-secondary:hover { color: rgba(255, 255, 255, 0.6); }
        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>️ Acesso Restrito</h1>
        <p>Este ambiente contém material destinado <strong>exclusivamente a maiores de 18 anos</strong>. Ao prosseguir, você declara ter idade legal e assume total responsabilidade.</p>
        
        <a id="telegram-link" href="https://t.me/ninfalucybot?start=organic" class="btn-primary">
            SIM, TENHO +18 | ACESSAR AGORA
        </a>
        
        <a class="btn-secondary" onclick="window.location.href='https://www.google.com';">
            Não tenho 18 anos, sair agora
        </a>
    </div>
    
    <footer>
        &copy; 2026 Todos os direitos reservados. Conteúdo protegido.
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const clickId = urlParams.get('c') || 'organic';
            const linkElement = document.getElementById('telegram-link');
            const baseUrl = "https://t.me/ninfalucybot";
            linkElement.href = baseUrl + "?start=" + clickId;
        });
    </script>
</body>
</html>
